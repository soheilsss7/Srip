services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: srip
      POSTGRES_PASSWORD: srip_dev
      POSTGRES_DB: srip
    ports: ["5432:5432"]
    volumes:
      - srip_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srip -d srip"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes:
      - srip_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.3_base
    ports: ["3310:3310"]
    volumes:
      - srip_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://srip:srip_dev@postgres:5432/srip?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret}
      QUEUE_WORKER_ENABLED: "false"
      FILE_SCAN_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-10000}
      RATE_LIMIT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_GLOBAL_WINDOW_MS:-60000}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-500}
      RATE_LIMIT_IP_WINDOW_MS: ${RATE_LIMIT_IP_WINDOW_MS:-60000}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-1000}
      RATE_LIMIT_USER_WINDOW_MS: ${RATE_LIMIT_USER_WINDOW_MS:-60000}
      RATE_LIMIT_ENDPOINT_MAX: ${RATE_LIMIT_ENDPOINT_MAX:-120}
      RATE_LIMIT_ENDPOINT_WINDOW_MS: ${RATE_LIMIT_ENDPOINT_WINDOW_MS:-60000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-900000}
      RATE_LIMIT_PASSWORD_RESET_MAX: ${RATE_LIMIT_PASSWORD_RESET_MAX:-5}
      RATE_LIMIT_PASSWORD_RESET_WINDOW_MS: ${RATE_LIMIT_PASSWORD_RESET_WINDOW_MS:-900000}
      RATE_LIMIT_MFA_MAX: ${RATE_LIMIT_MFA_MAX:-10}
      RATE_LIMIT_MFA_WINDOW_MS: ${RATE_LIMIT_MFA_WINDOW_MS:-300000}
      RATE_LIMIT_EXPORT_MAX: ${RATE_LIMIT_EXPORT_MAX:-20}
      RATE_LIMIT_EXPORT_WINDOW_MS: ${RATE_LIMIT_EXPORT_WINDOW_MS:-600000}
      RATE_LIMIT_SEARCH_MAX: ${RATE_LIMIT_SEARCH_MAX:-120}
      RATE_LIMIT_SEARCH_WINDOW_MS: ${RATE_LIMIT_SEARCH_WINDOW_MS:-60000}
      RATE_LIMIT_BULK_IMPORT_MAX: ${RATE_LIMIT_BULK_IMPORT_MAX:-10}
      RATE_LIMIT_BULK_IMPORT_WINDOW_MS: ${RATE_LIMIT_BULK_IMPORT_WINDOW_MS:-600000}
      RATE_LIMIT_WEBHOOK_MAX: ${RATE_LIMIT_WEBHOOK_MAX:-300}
      RATE_LIMIT_WEBHOOK_WINDOW_MS: ${RATE_LIMIT_WEBHOOK_WINDOW_MS:-60000}
      RATE_LIMIT_SENSITIVE_MAX: ${RATE_LIMIT_SENSITIVE_MAX:-30}
      RATE_LIMIT_SENSITIVE_WINDOW_MS: ${RATE_LIMIT_SENSITIVE_WINDOW_MS:-60000}
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://srip:srip_dev@postgres:5432/srip?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret}
      QUEUE_WORKER_ENABLED: "true"
      QUEUE_CONCURRENCY: 5
      QUEUE_MAX_ATTEMPTS: 5
      QUEUE_BACKOFF_MS: 2000
      QUEUE_RATE_LIMIT_MAX: 100
      QUEUE_RATE_LIMIT_DURATION_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  srip_pg:
  srip_redis:
  srip_clamav:
